[package]
name = "cleara"
version = "0.1.0"
description = "Scheduled uniform-price exit auctions for thin tokenized assets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cleara"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.32.1"
anchor-spl = "=0.32.1"
